name: Impostor
afterGenerate:
  - script: cd .. && ./gradlew :composeApp:assembleComposeAppReleaseXCFramework --no-daemon
    name: Build Compose XCFramework
options:
  bundleIdPrefix: com.impostor
  deploymentTarget:
    iOS: "17.2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
targets:
  Impostor:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: iosApp.swift
      - path: Assets.xcassets
    settings:
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.rafal.impostorparty
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_ENTITLEMENTS: Impostor.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: 5.0
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      FRAMEWORK_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../composeApp/build/XCFrameworks/release/composeApp.xcframework/ios-arm64
        - $(SRCROOT)/../composeApp/build/XCFrameworks/release/composeApp.xcframework/ios-arm64-simulator
      OTHER_LDFLAGS:
        - $(inherited)
        - -ObjC
    dependencies:
      - framework: ../composeApp/build/XCFrameworks/release/composeApp.xcframework
        embed: true
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAnalytics
    scheme:
      testTargets: []
      gatherCoverageData: false
    postBuildScripts:
      - name: Copy runtime configuration and bundled catalog
        inputFiles:
          - "${SRCROOT}/../shared/data/src/commonMain/resources/seed/prompts.json"
        outputFiles:
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/prompts.json"
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/icon-60@2x.png"
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/icon-60@3x.png"
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/icon-76@2x-ipad.png"
          - "${DWARF_DSYM_FOLDER_PATH}/ComposeApp.framework.dSYM/Contents/Resources/DWARF/ComposeApp"
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -f "${SRCROOT}/GoogleService-Info.plist" ]; then
            cp "${SRCROOT}/GoogleService-Info.plist" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          fi
          cp "${SRCROOT}/../shared/data/src/commonMain/resources/seed/prompts.json" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/prompts.json"
          cp "${SRCROOT}/Assets.xcassets/AppIcon.appiconset/icon-60@2x.png" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/icon-60@2x.png"
          cp "${SRCROOT}/Assets.xcassets/AppIcon.appiconset/icon-60@3x.png" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/icon-60@3x.png"
          cp "${SRCROOT}/Assets.xcassets/AppIcon.appiconset/icon-76@2x-ipad.png" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/icon-76@2x-ipad.png"
          framework_binary="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/ComposeApp.framework/ComposeApp"
          if [ -f "$framework_binary" ] && command -v dsymutil >/dev/null 2>&1; then
            mkdir -p "${DWARF_DSYM_FOLDER_PATH}"
            dsymutil "$framework_binary" -o "${DWARF_DSYM_FOLDER_PATH}/ComposeApp.framework.dSYM"
          fi
